<style>
  :root{--rot:#c8102e;--bg:#fbf7f1;--ink:#1f1d1b;--grau:#6b6560;--linie:#e8e0d4;--gold:#f4b400;--blau:#eaf2fd;--blau2:#2f6fc6;--gruen:#e7f5ea;--gruen2:#2e8b4a}
  *{box-sizing:border-box;min-width:0}
  html{scroll-padding-top:70px}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
  h1,h2,h3{font-family:Outfit,system-ui,sans-serif}
  header{background:var(--rot);color:#fff;padding:18px max(4vw,16px) 24px;position:relative;overflow:hidden}
  header svg{position:absolute;right:-10px;bottom:-6px;height:130px;opacity:.18}
  .sprachen{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;position:relative;z-index:1}
  .sprachen button{font:600 14px Inter,sans-serif;color:#fff;background:transparent;border:2px solid rgba(255,255,255,.85);border-radius:99px;padding:6px 12px;min-height:38px;cursor:pointer}
  .sprachen button.an{background:#fff;color:var(--rot)}
  header h1{margin:0;font-size:clamp(32px,8vw,48px);line-height:1.05;position:relative}
  header p{margin:8px 0 0;opacity:.94;position:relative;max-width:560px}
  .chips{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--linie);display:flex;gap:6px;overflow-x:auto;padding:10px max(4vw,16px);scrollbar-width:none}
  .chips button{flex:none;font:600 14px Inter,sans-serif;border:1px solid var(--linie);background:var(--bg);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer;color:var(--ink)}
  .chips button.an{background:var(--rot);color:#fff;border-color:var(--rot)}
  main{max-width:780px;margin:0 auto;padding:18px max(4vw,16px) 50px}
  .erasmus{background:var(--blau);border-left:5px solid var(--blau2);border-radius:14px;padding:14px 16px;margin:0 0 22px}
  .erasmus h2{margin:0 0 4px;font-size:20px;color:var(--blau2)}
  .erasmus p{margin:0}
  .frage{font:800 clamp(22px,5vw,28px)/1.15 Outfit,sans-serif;margin:28px 0 4px}
  .frage+p{color:var(--grau);margin:0 0 12px}
  .karte{background:#fff;border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
  .karte h3{margin:0;font-size:20px;line-height:1.2}
  .wo{color:var(--grau);font-size:14px;margin:2px 0 8px}
  .karte p.txt{margin:0 0 10px}
  .tipp{background:var(--gruen);border-left:4px solid var(--gruen2);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:15px}
  .tipp b{color:var(--gruen2)}
  .aktionen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .merk{font:600 14px Inter,sans-serif;border:2px solid var(--linie);background:#fff;border-radius:99px;padding:6px 14px;min-height:40px;cursor:pointer;color:var(--ink)}
  .merk.an{border-color:var(--gold);background:#fff7dc}
  details{flex:1 1 100%}
  summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--blau2);padding:6px 0;min-height:32px}
  textarea{width:100%;min-height:80px;font:16px Inter,sans-serif;padding:10px 12px;border:2px solid var(--linie);border-radius:10px;margin-top:6px;resize:vertical;color:var(--ink);background:#fff}
  textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .gespeichert{font-size:13px;color:var(--gruen2);min-height:18px}
  .raetsel p{margin:0 0 8px}
  .antwort{display:flex;gap:8px}
  .antwort input{flex:1;font:16px Inter,sans-serif;padding:10px 12px;border:2px solid var(--linie);border-radius:10px}
  .antwort button,.knopf{font:700 15px Outfit,sans-serif;border:0;border-radius:10px;padding:0 16px;min-height:46px;background:var(--ink);color:#fff;cursor:pointer}
  .knopf{background:var(--rot);width:100%;font-size:17px;margin:6px 0}
  .meld{margin-top:6px;font-weight:600;font-size:15px}
  .meld.ja{color:var(--gruen2)} .meld.nein{color:#c0392b}
  .leer{color:var(--grau);text-align:center;padding:20px}
  .notiz-ort{font-weight:700;margin:0}
  .notiz-txt{white-space:pre-wrap;margin:4px 0 0}
  footer{text-align:center;color:var(--grau);font-size:13px;padding:0 16px 30px}
</style>

 alle:["Alles","Todo","Everything","Dena"],

 erasmus:["Nutzt die Infos auf dieser Seite für euer Erasmus-Projekt! Macht Fotos, schreibt bei jedem Ort eine kurze Notiz und kopiert am Ende alles unter „Meine Notizen“. Tipp: Vergleicht Köln mit eurer eigenen Stadt.","¡Usad la información de esta página para vuestro proyecto Erasmus! Haced fotos, escribid una nota breve en cada lugar y al final copiadlo todo en «Mis notas». Consejo: comparad Colonia con vuestra propia ciudad.","Use the information on this page for your Erasmus project! Take photos, write a short note at each place and copy everything at the end under “My notes”. Tip: compare Cologne with your own city.","Erabili orrialde honetako informazioa zuen Erasmus proiekturako! Atera argazkiak, idatzi ohar labur bat leku bakoitzean eta amaieran kopiatu dena «Nire oharrak» atalean. Aholkua: konparatu Kolonia zuen hiriarekin."],

const K=[
 {id:"roemer",n:["Römer","Romanos","Romans","Erromatarrak"],q:["Willst du sehen, wie die Römer hier gelebt haben?","¿Quieres ver cómo vivían aquí los romanos?","Want to see how the Romans lived here?","Ikusi nahi duzu erromatarrek nola bizi ziren hemen?"],s:["Köln war vor 2000 Jahren eine römische Stadt. Hier findest du ihre Spuren.","Hace 2000 años Colonia era una ciudad romana. Aquí encuentras sus huellas.","2000 years ago Cologne was a Roman city. Here you'll find its traces.","Duela 2000 urte Kolonia hiri erromatarra zen. Hemen aurkituko dituzu bere arrastoak."]},
 {id:"bauwerke",n:["Dom & Kirchen","Catedral e iglesias","Cathedral & churches","Katedrala eta elizak"],q:["Magst du große Bauwerke und Geschichte?","¿Te gustan los grandes edificios y la historia?","Do you like big buildings and history?","Eraikin handiak eta historia gustatzen zaizkizu?"],s:["Drei Kirchen, drei ganz verschiedene Geschichten.","Tres iglesias, tres historias muy diferentes.","Three churches, three very different stories.","Hiru eliza, hiru istorio oso desberdin."]},
 {id:"sagen",n:["Sagen & Figuren","Leyendas y figuras","Legends & figures","Kondairak eta irudiak"],q:["Magst du Geschichten und lustige Figuren?","¿Te gustan las historias y los personajes divertidos?","Do you like stories and funny characters?","Istorioak eta pertsonaia dibertigarriak gustatzen zaizkizu?"],s:["Köln steckt voller Sagen – und manche Figuren sind ganz schön frech.","Colonia está llena de leyendas, y algunas figuras son bastante descaradas.","Cologne is full of legends – and some figures are pretty cheeky.","Kolonia kondairaz beteta dago, eta irudi batzuk nahiko lotsagabeak dira."]},
 {id:"fotos",n:["Aussicht & Fotos","Vistas y fotos","Views & photos","Bistak eta argazkiak"],q:["Willst du Köln von oben sehen und die besten Fotos machen?","¿Quieres ver Colonia desde arriba y hacer las mejores fotos?","Want to see Cologne from above and take the best photos?","Kolonia goitik ikusi eta argazkirik onenak atera nahi dituzu?"],s:["Die schönsten Blicke auf die Stadt.","Las vistas más bonitas de la ciudad.","The most beautiful views of the city.","Hiriaren bistarik ederrenak."]},
 {id:"kultur",n:["Typisch Köln","Típico de Colonia","Typical Cologne","Kolonia tipikoa"],q:["Willst du typisch Kölsches probieren und erleben?","¿Quieres probar y vivir lo más típico de Colonia?","Want to taste and experience typical Cologne?","Koloniako gauza tipikoak dastatu eta bizi nahi dituzu?"],s:["Duft, Essen, Karneval und Schokolade.","Perfume, comida, carnaval y chocolate.","Fragrance, food, carnival and chocolate.","Lurrina, janaria, inauteriak eta txokolatea."]},
 {id:"raetsel",n:["Rätsel","Enigmas","Riddles","Igarkizunak"],q:["Hast du Lust auf Rätsel?","¿Te apetecen unos enigmas?","Fancy some riddles?","Igarkizunak egin nahi dituzu?"],s:["Die Antworten findest du unterwegs. Wer mag, kann sie hier prüfen.","Las respuestas las encontrarás por el camino. Si quieres, puedes comprobarlas aquí.","You'll find the answers along the way. Check them here if you like.","Erantzunak bidean aurkituko dituzu. Nahi baduzu, hemen egiazta ditzakezu."]}
];
const O=[
 {id:"rgm",k:"roemer",o:["Römisch-Germanisches Museum","Museo Romano-Germánico","Romano-Germanic Museum","Erromatar-Germaniar Museoa"],w:["Roncalliplatz, neben dem Dom","Roncalliplatz, junto a la catedral","Roncalliplatz, next to the cathedral","Roncalliplatz, katedralaren ondoan"],
  t:["1941 wollte man hier einen Bunker bauen und fand dabei das Dionysos-Mosaik: über eine Million Steinchen aus dem Speisesaal einer reichen römischen Villa. Das Museum wurde direkt darüber gebaut.","En 1941 se quería construir aquí un búnker y se encontró el mosaico de Dioniso: más de un millón de teselas del comedor de una rica villa romana. El museo se construyó justo encima.","In 1941 a bunker was going to be built here, and the Dionysus mosaic was found: over a million tiny stones from the dining room of a rich Roman villa. The museum was built right on top of it.","1941ean bunker bat eraiki nahi zen hemen, eta Dionisoren mosaikoa aurkitu zen: milioi bat tesela baino gehiago, erromatar etxe aberats bateko jangelakoak. Museoa haren gainean eraiki zen."],
  d:["Das Museum wird gerade saniert. Schau, ob du durch die Glasscheibe etwas siehst.","El museo está en obras. Mira si ves algo a través del cristal.","The museum is being renovated. See if you can spot anything through the glass.","Museoa berritzen ari dira. Begiratu ea beiran zehar zerbait ikusten duzun."]},
 {id:"hafen",k:"roemer",o:["Römische Hafenstraße","Calle romana del puerto","Roman harbour road","Portuko erromatar kalea"],w:["Neben dem Römisch-Germanischen Museum","Junto al Museo Romano-Germánico","Next to the Romano-Germanic Museum","Erromatar-Germaniar Museoaren ondoan"],
  t:["Echtes römisches Pflaster, fast 2000 Jahre alt. Die Straße führte steil hinunter zum Hafen am Rhein.","Adoquines romanos auténticos, de casi 2000 años. La calle bajaba empinada hasta el puerto del Rin.","Real Roman paving, almost 2000 years old. The road led steeply down to the harbour on the Rhine.","Benetako galtzada erromatarra, ia 2000 urtekoa. Kalea aldapan jaisten zen Rhingo portura."],
  d:["Lauf ein Stück darüber und stell dir vor, du ziehst einen Karren voller Waren hoch.","Camina un poco por encima e imagina que subes un carro lleno de mercancías.","Walk on it for a bit and imagine pulling a cart full of goods up the hill.","Ibili pixka bat gainean eta imajinatu salgaiz betetako orga bat igotzen ari zarela."]},
 {id:"praetorium",k:"roemer",o:["Praetorium","Pretorio","Praetorium","Pretorioa"],w:["Unter dem Rathaus","Debajo del ayuntamiento","Under the town hall","Udaletxearen azpian"],
  t:["Hier stand der Palast des römischen Statthalters. Er regierte die Provinz Niedergermanien bis zur Nordsee – Köln war eine Art Hauptstadt.","Aquí estaba el palacio del gobernador romano. Gobernaba la provincia de Germania Inferior hasta el mar del Norte: Colonia era una especie de capital.","The palace of the Roman governor stood here. He ruled the province of Lower Germania up to the North Sea – Cologne was a kind of capital.","Hemen zegoen gobernadore erromatarraren jauregia. Germania Beherea probintzia gobernatzen zuen Ipar itsasoraino: Kolonia hiriburu moduko bat zen."],
  d:["Es wird Teil des neuen Museums MiQua, das noch gebaut wird. Wirf einen Blick auf die Baustelle.","Formará parte del nuevo museo MiQua, que todavía está en obras. Echa un vistazo a las obras.","It will be part of the new MiQua museum, which is still under construction. Have a look at the building site.","MiQua museo berriaren parte izango da, oraindik eraikitzen ari direna. Begiratu obrei."]},
 {id:"dom",k:"bauwerke",o:["Kölner Dom","Catedral de Colonia","Cologne Cathedral","Koloniako katedrala"],w:["Domplatte","Explanada de la catedral","Cathedral square","Katedralaren plaza"],
  t:["157 Meter hoch, über 600 Jahre Bauzeit (1248–1880), UNESCO-Welterbe. Gebaut wurde er für die Reliquien der Heiligen Drei Könige.","157 metros de altura, más de 600 años de obras (1248–1880), Patrimonio de la Humanidad. Se construyó para las reliquias de los Reyes Magos.","157 metres tall, over 600 years of construction (1248–1880), UNESCO World Heritage. It was built for the relics of the Three Kings.","157 metroko altuera, 600 urte baino gehiagoko obrak (1248–1880), UNESCOren Gizateriaren Ondarea. Errege Magoen erlikientzat eraiki zen."],
  d:["Innen: der goldene Dreikönigenschrein, das Richter-Fenster aus über 11.000 Farbquadraten und das über 1000 Jahre alte Gerokreuz.","Dentro: el relicario dorado de los Reyes Magos, la vidriera de Richter con más de 11.000 cuadrados de colores y la cruz de Gero, de más de 1000 años.","Inside: the golden Shrine of the Three Kings, the Richter window with over 11,000 coloured squares and the Gero Cross, over 1000 years old.","Barruan: Errege Magoen urrezko erlikiontzia, 11.000 karratu koloretsu baino gehiagoko Richter beiratea eta 1000 urte baino gehiagoko Geroren gurutzea."]},
 {id:"martin",k:"bauwerke",o:["Groß St. Martin","Gran San Martín","Great St. Martin","San Martin Handia"],w:["Altstadt am Rhein","Casco antiguo, junto al Rin","Old town by the Rhine","Alde zaharra, Rhin ondoan"],
  t:["Eine romanische Kirche, älter als der Dom. Sie steht auf einer früheren Rheininsel. Darunter fand man Reste römischer Lagerhallen.","Una iglesia románica, más antigua que la catedral. Está sobre una antigua isla del Rin. Debajo se encontraron restos de almacenes romanos.","A Romanesque church, older than the cathedral. It stands on a former island in the Rhine. Remains of Roman warehouses were found underneath.","Eliza erromanikoa, katedrala baino zaharragoa. Rhingo antzinako uharte batean dago. Azpian erromatar biltegien aztarnak aurkitu ziren."],
  d:["Vergleiche den massiven, runden Turm mit den spitzen Domtürmen: Romanik gegen Gotik.","Compara la torre maciza y redondeada con las torres puntiagudas de la catedral: románico frente a gótico.","Compare the massive, rounded tower with the pointed cathedral towers: Romanesque versus Gothic.","Konparatu dorre sendo eta biribila katedralaren dorre zorrotzekin: erromanikoa gotikoaren aurka."]},
 {id:"madonna",k:"bauwerke",o:["Madonna in den Trümmern","La Virgen de las Ruinas","Madonna in the Ruins","Hondakinetako Ama Birjina"],w:["Kolumbastraße, ca. 10 Minuten vom Alter Markt","Kolumbastraße, a unos 10 minutos del Alter Markt","Kolumbastraße, about 10 minutes from Alter Markt","Kolumbastraße, Alter Markt-etik 10 bat minutura"],
  t:["1945 wurde die Kirche St. Kolumba fast ganz zerstört. Nur eine Madonnenfigur blieb heil – für die Kölner ein Zeichen der Hoffnung. Heute steht darüber das Museum Kolumba.","En 1945 la iglesia de Santa Columba quedó casi totalmente destruida. Solo una figura de la Virgen quedó intacta: para la gente de Colonia, un símbolo de esperanza. Hoy encima está el museo Kolumba.","In 1945 the church of St Columba was almost completely destroyed. Only a statue of the Madonna survived – a sign of hope for the people of Cologne. Today the Kolumba museum stands above it.","1945ean Santa Kolunba eliza ia erabat suntsitu zen. Ama Birjinaren irudi bat bakarrik geratu zen osorik: koloniarrentzat itxaropenaren ikurra. Gaur egun Kolumba museoa dago gainean."],
  d:["Such die Stelle, wo die alte Ruinenmauer und die neuen hellen Ziegel zusammenstoßen.","Busca el punto donde el viejo muro en ruinas se une con los nuevos ladrillos claros.","Find the spot where the old ruined wall meets the new light bricks.","Bilatu horma zahar hondatua eta adreilu argi berriak elkartzen diren lekua."]},
 {id:"heinzel",k:"sagen",o:["Heinzelmännchenbrunnen","Fuente de los Heinzelmännchen","Heinzelmännchen Fountain","Heinzelmännchen iturria"],w:["Beim Dom, neben einem Brauhaus","Junto a la catedral, al lado de una cervecería","Near the cathedral, next to a Brauhaus","Katedralaren ondoan, garagardotegi baten alboan"],
  t:["Früher erledigten kleine Zwerge nachts heimlich die Arbeit der Kölner. Eine neugierige Schneidersfrau streute Erbsen, um sie zu sehen. Die Zwerge stolperten und kamen nie wieder.","Antes, unos pequeños duendes hacían en secreto por la noche el trabajo de la gente de Colonia. La curiosa mujer de un sastre esparció guisantes para verlos. Los duendes tropezaron y no volvieron nunca.","Little gnomes used to secretly do the people's work at night. A curious tailor's wife scattered peas to see them. The gnomes tripped and never came back.","Lehen, iratxo txikiek gauez ezkutuan egiten zuten koloniarren lana. Jostun baten emazte jakin-minak ilarrak bota zituen haiek ikusteko. Iratxoek estropezu egin zuten eta ez ziren inoiz itzuli."],
  d:["Finde die Schneidersfrau mit der Laterne und die stolpernden Zwerge.","Encuentra a la mujer del sastre con el farol y a los duendes tropezando.","Find the tailor's wife with the lantern and the tumbling gnomes.","Aurkitu jostunaren emaztea farolarekin eta estropezu egiten ari diren iratxoak."]},
 {id:"tuennes",k:"sagen",o:["Tünnes und Schäl","Tünnes y Schäl","Tünnes and Schäl","Tünnes eta Schäl"],w:["Kleine Gasse bei Groß St. Martin","Callejuela junto a Groß St. Martin","Small lane near Groß St. Martin","Groß St. Martin ondoko kaleska"],
  t:["Zwei Figuren aus dem Kölner Puppentheater: Tünnes, gutmütig mit dicker Nase, und Schäl, der Schlaue, der nicht ganz ehrlich ist. Über sie gibt es unzählige Witze.","Dos personajes del teatro de marionetas de Colonia: Tünnes, bonachón y con una gran nariz, y Schäl, el listillo que no es del todo honrado. Hay muchísimos chistes sobre ellos.","Two characters from Cologne's puppet theatre: Tünnes, good-natured with a big nose, and Schäl, the clever one who isn't quite honest. There are countless jokes about them.","Koloniako txotxongilo-antzokiko bi pertsonaia: Tünnes, onbera eta sudur handikoa, eta Schäl, azkarra baina ez guztiz zintzoa. Txiste ugari daude haiei buruz."],
  d:["Reib Tünnes die Nase – das soll Glück bringen. Deshalb glänzt sie so!","Frota la nariz de Tünnes: dicen que trae suerte. ¡Por eso brilla tanto!","Rub Tünnes' nose – it's supposed to bring luck. That's why it shines!","Igurtzi Tünnesen sudurra: zortea ematen omen du. Horregatik distiratzen du hainbeste!"]},
 {id:"jabbeck",k:"sagen",o:["Platzjabbeck","Platzjabbeck","Platzjabbeck","Platzjabbeck"],w:["Rathausturm, unter der Uhr","Torre del ayuntamiento, bajo el reloj","Town hall tower, under the clock","Udaletxeko dorrea, erlojuaren azpian"],
  t:["Ein Holzkopf unter der Uhr des Ratsturms, der sich über alle lustig macht.","Una cabeza de madera bajo el reloj de la torre que se burla de todo el mundo.","A wooden head under the tower clock that makes fun of everyone.","Dorreko erlojuaren azpiko egurrezko buru bat, denei barre egiten diena."],
  d:["Warte auf die volle Stunde und schau genau hin!","¡Espera a la hora en punto y fíjate bien!","Wait for the full hour and watch closely!","Itxaron ordu jo arte eta begiratu ondo!"]},
 {id:"kallendresser",k:"sagen",o:["Kallendresser","Kallendresser","Kallendresser","Kallendresser"],w:["Alter Markt, an einer Hausfassade","Alter Markt, en la fachada de una casa","Alter Markt, on a house front","Alter Markt, etxe baten fatxadan"],
  t:["Eine Figur, die dem Rathaus den nackten Po zeigt – ein frecher Spott der Kölner auf ihre Politiker.","Una figura que le enseña el trasero al ayuntamiento: una burla descarada de la gente de Colonia a sus políticos.","A figure showing its bare bottom to the town hall – a cheeky joke by the people of Cologne about their politicians.","Udaletxeari ipurdi biluzia erakusten dion irudia: koloniarrek beren politikariei egindako iseka lotsagabea."],
  d:["Wer findet ihn zuerst?","¿Quién lo encuentra primero?","Who can find it first?","Nork aurkitzen du lehenengo?"]},
 {id:"janwerth",k:"sagen",o:["Jan-von-Werth-Brunnen","Fuente de Jan von Werth","Jan von Werth Fountain","Jan von Werth iturria"],w:["Mitten auf dem Alter Markt","En el centro del Alter Markt","In the middle of Alter Markt","Alter Markt plazaren erdian"],
  t:["Der Knecht Jan liebte die Magd Griet, aber sie wollte keinen armen Knecht. Jan wurde ein berühmter General. Als er Jahre später zurückkam, war Griet immer noch allein.","El mozo Jan amaba a la criada Griet, pero ella no quería a un mozo pobre. Jan se convirtió en un general famoso. Cuando volvió años después, Griet seguía sola.","The farmhand Jan loved the maid Griet, but she didn't want a poor farmhand. Jan became a famous general. When he came back years later, Griet was still alone.","Jan morroiak Griet neskamea maite zuen, baina hark ez zuen morroi pobre bat nahi. Jan jeneral ospetsu bihurtu zen. Urte batzuk geroago itzuli zenean, Griet bakarrik zegoen oraindik."],
  d:["Schau dir die Figuren am Brunnen an: Wer ist Jan, wer ist Griet?","Mira las figuras de la fuente: ¿quién es Jan y quién es Griet?","Look at the figures on the fountain: who is Jan, who is Griet?","Begiratu iturriko irudiei: nor da Jan eta nor Griet?"]},
 {id:"suedturm",k:"fotos",o:["Südturm des Doms","Torre sur de la catedral","South tower of the cathedral","Katedralaren hegoaldeko dorrea"],w:["Eingang außen am Dom","Entrada por fuera de la catedral","Entrance outside the cathedral","Sarrera katedralaren kanpoaldean"],
  t:["533 Stufen führen hinauf zu einer Aussicht in knapp 100 Metern Höhe. Von oben siehst du die ganze Stadt und den Rhein.","533 escalones suben hasta un mirador a casi 100 metros de altura. Desde arriba ves toda la ciudad y el Rin.","533 steps lead up to a viewpoint almost 100 metres high. From the top you can see the whole city and the Rhine.","533 eskailera-mailak ia 100 metroko altuerako begiratokira igotzen dira. Goitik hiri osoa eta Rhin ibaia ikusten dira."],
  d:["Der Aufstieg kostet Eintritt und ist anstrengend – aber die Aussicht lohnt sich!","La subida cuesta dinero y es cansada, ¡pero las vistas merecen la pena!","The climb costs an entry fee and is tiring – but the view is worth it!","Igoerak sarrera ordaindu behar du eta nekagarria da, baina bistak merezi du!"]},
 {id:"bruecke",k:"fotos",o:["Hohenzollernbrücke","Puente Hohenzollern","Hohenzollern Bridge","Hohenzollern zubia"],w:["Hinter dem Dom über den Rhein","Detrás de la catedral, sobre el Rin","Behind the cathedral, across the Rhine","Katedralaren atzean, Rhinaren gainean"],
  t:["Tausende Liebesschlösser hängen am Geländer. Paare schließen sie ab und werfen den Schlüssel in den Rhein.","Miles de candados del amor cuelgan de la barandilla. Las parejas los cierran y tiran la llave al Rin.","Thousands of love locks hang on the railings. Couples lock them and throw the key into the Rhine.","Milaka maitasun-giltzarrapo daude barandan zintzilik. Bikoteek ixten dituzte eta giltza Rhinera botatzen dute."],
  d:["Geh über die Brücke nach Deutz – Züge donnern direkt neben dir vorbei.","Cruza el puente hasta Deutz: los trenes pasan justo a tu lado.","Walk across the bridge to Deutz – trains thunder past right next to you.","Gurutzatu zubia Deutzeraino: trenak zure ondoan pasatzen dira."]},
 {id:"boulevard",k:"fotos",o:["Rheinboulevard in Deutz","Rheinboulevard en Deutz","Rheinboulevard in Deutz","Rheinboulevard Deutzen"],w:["Auf der anderen Rheinseite, am Ende der Brücke","Al otro lado del Rin, al final del puente","On the other side of the Rhine, at the end of the bridge","Rhinaren beste aldean, zubiaren amaieran"],
  t:["Eine große Treppe direkt am Wasser. Hier sitzen die Kölner gern in der Sonne.","Una gran escalinata junto al agua. A la gente de Colonia le gusta sentarse aquí al sol.","A big flight of steps right by the water. People from Cologne love sitting here in the sun.","Eskailera handi bat uraren ondoan. Koloniarrei eguzkitan hemen esertzea gustatzen zaie."],
  d:["Von hier machst du das Postkartenfoto: Dom, Brücke und Altstadt zusammen.","Desde aquí haces la foto de postal: catedral, puente y casco antiguo juntos.","Take the postcard photo from here: cathedral, bridge and old town together.","Hemendik ateratzen duzu postaleko argazkia: katedrala, zubia eta alde zaharra batera."]},
 {id:"fischmarkt",k:"fotos",o:["Fischmarkt","Fischmarkt (mercado del pescado)","Fischmarkt (fish market)","Fischmarkt (arrain-azoka)"],w:["Altstadt, zwischen Groß St. Martin und Rhein","Casco antiguo, entre Groß St. Martin y el Rin","Old town, between Groß St. Martin and the Rhine","Alde zaharra, Groß St. Martin eta Rhinaren artean"],
  t:["Hier wurde im Mittelalter Fisch verkauft. Die schmalen, bunten Häuser sind das berühmteste Bild der Kölner Altstadt.","Aquí se vendía pescado en la Edad Media. Las casas estrechas y de colores son la imagen más famosa del casco antiguo.","Fish was sold here in the Middle Ages. The narrow, colourful houses are the most famous picture of Cologne's old town.","Erdi Aroan arraina saltzen zen hemen. Etxe estu eta koloretsuak Koloniako alde zaharreko irudirik ospetsuena dira."],
  d:["Foto-Ideen: Tanzt Walzer mit dem Rhein im Hintergrund oder macht ein Foto mit der kleinen „Bimmelbahn“.","Ideas para fotos: bailad un vals con el Rin de fondo o haced una foto con el trenecito «Bimmelbahn».","Photo ideas: dance a waltz with the Rhine in the background or take a photo with the little “Bimmelbahn” train.","Argazki-ideiak: dantzatu bals bat Rhin atzean dela edo atera argazki bat «Bimmelbahn» tren txikiarekin."]},
 {id:"duft",k:"kultur",o:["Kölnisch Wasser","Agua de Colonia","Eau de Cologne","Koloniako ura"],w:["Glockengasse und Farina-Duftmuseum beim Alter Markt","Glockengasse y Museo de la Fragancia Farina, junto al Alter Markt","Glockengasse and Farina Fragrance Museum near Alter Markt","Glockengasse eta Farina Lurrin Museoa, Alter Markt ondoan"],
  t:["1709 erfand der Italiener Johann Maria Farina in Köln das „Eau de Cologne“. Die Marke 4711 heißt nach einer Hausnummer: Die Franzosen nummerierten um 1800 alle Häuser der Stadt durch.","En 1709 el italiano Johann Maria Farina creó en Colonia el «Eau de Cologne». La marca 4711 se llama así por un número de casa: hacia 1800 los franceses numeraron todas las casas de la ciudad.","In 1709 the Italian Johann Maria Farina created “Eau de Cologne” here. The brand 4711 is named after a house number: around 1800 the French numbered all the houses in the city.","1709an Johann Maria Farina italiarrak «Eau de Cologne» sortu zuen Kolonian. 4711 markak etxe-zenbaki batetik hartzen du izena: 1800 inguruan frantsesek hiriko etxe guztiak zenbakitu zituzten."],
  d:["Schnupper im Laden in der Glockengasse oder im Farina-Duftmuseum.","Huele en la tienda de la Glockengasse o en el Museo de la Fragancia Farina.","Have a sniff in the shop on Glockengasse or at the Farina Fragrance Museum.","Usaindu Glockengasse-ko dendan edo Farina Lurrin Museoan."]},
 {id:"essen",k:"kultur",o:["Halve Hahn & Brauhaus","Halve Hahn y Brauhaus","Halve Hahn & Brauhaus","Halve Hahn eta Brauhaus"],w:["In den Brauhäusern der Altstadt","En las cervecerías del casco antiguo","In the old town's brewhouses","Alde zaharreko garagardotegietan"],
  t:["„Halver Hahn“ heißt „halbes Hähnchen“ – ist aber ein Roggenbrötchen mit Käse und Senf. In den Brauhäusern isst man typisch kölsche Gerichte.","«Halver Hahn» significa «medio pollo», pero es un panecillo de centeno con queso y mostaza. En las cervecerías se come comida típica de Colonia.","“Halver Hahn” means “half a chicken” – but it's a rye roll with cheese and mustard. In the brewhouses you can eat typical Cologne dishes.","«Halver Hahn»-ek «oilasko erdia» esan nahi du, baina zekale-ogitxo bat da, gaztarekin eta mostazarekin. Garagardotegietan Koloniako janari tipikoa jaten da."],
  d:["Probier einen Halven Hahn und frag dich, wer sich den Namen ausgedacht hat.","Prueba un Halven Hahn y pregúntate a quién se le ocurrió ese nombre.","Try a Halve Hahn and wonder who came up with that name.","Dastatu Halve Hahn bat eta galdetu zeure buruari nori bururatu zitzaion izen hori."]},
 {id:"karneval",k:"kultur",o:["Karneval","Carnaval","Carnival","Inauteriak"],w:["Alter Markt","Alter Markt","Alter Markt","Alter Markt"],
  t:["Die Session beginnt jedes Jahr am 11.11. um 11:11 Uhr – genau hier. Am Rosenmontag zieht der große Umzug durch die Stadt, und vom Wagen fliegen Süßigkeiten, die „Kamelle“.","La temporada empieza cada año el 11/11 a las 11:11, justo aquí. El lunes de carnaval el gran desfile recorre la ciudad y desde las carrozas se tiran caramelos, los «Kamelle».","The season starts every year on 11 November at 11:11 – right here. On Rose Monday the big parade goes through the city, and sweets called “Kamelle” are thrown from the floats.","Denboraldia urtero azaroaren 11n hasten da, 11:11etan, hementxe bertan. Inauteri-astelehenean desfile handiak hiria zeharkatzen du, eta karrozetatik «Kamelle» izeneko gozokiak botatzen dira."],
  d:["Ruft einmal alle zusammen: „Kölle Alaaf!“","Gritad todos juntos: «Kölle Alaaf!»","Shout together: “Kölle Alaaf!”","Oihukatu denok batera: «Kölle Alaaf!»"]},
 {id:"schoko",k:"kultur",o:["Schokoladenmuseum","Museo del Chocolate","Chocolate Museum","Txokolate Museoa"],w:["Rheinauhafen, am Rhein","Rheinauhafen, junto al Rin","Rheinauhafen, on the Rhine","Rheinauhafen, Rhin ondoan"],
  t:["Ein Museum ganz rund um Schokolade: von der Kakaobohne bis zur fertigen Tafel.","Un museo dedicado al chocolate: desde el grano de cacao hasta la tableta.","A museum all about chocolate: from the cocoa bean to the finished bar.","Txokolateari buruzko museo bat: kakao-aletik tableta osatura arte."],
  d:["Am Schokoladenbrunnen gibt es eine Kostprobe.","En la fuente de chocolate hay una degustación.","There's a tasting at the chocolate fountain.","Txokolate-iturrian dastatzeko aukera dago."]}
];
const N=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");
const R=[
 {q:["Wie hoch ist der Dom? (in Metern)","¿Cuánto mide la catedral? (en metros)","How tall is the cathedral? (in metres)","Zenbat neurtzen du katedralak? (metrotan)"],ok:a=>/^157/.test(a)},
 {q:["Ergänze die Inschrift im Dom: „GOTT SEI IHREN SEELEN …“","Completa la inscripción de la catedral: «GOTT SEI IHREN SEELEN …»","Complete the inscription in the cathedral: “GOTT SEI IHREN SEELEN …”","Osatu katedraleko idazkuna: «GOTT SEI IHREN SEELEN …»"],ok:a=>["gnadig","gnaedig"].includes(a)},
 {q:["Welches Tier ist auf dem Türklopfer am Dom?","¿Qué animal hay en el llamador de la puerta de la catedral?","Which animal is on the cathedral's door knocker?","Zer animalia dago katedralaren ateko danbolinean?"],ok:a=>/(lowe|loewe|leon|lion|lehoi)/.test(a)},
 {q:["Der Petrusbrunnen ist nicht weit vom Dom. Woraus kommt das Wasser?","La fuente de San Pedro está cerca de la catedral. ¿Por dónde sale el agua?","St Peter's Fountain is near the cathedral. Where does the water come out?","San Pedro iturria katedraletik gertu dago. Nondik ateratzen da ura?"],ok:a=>/(lowe|loewe|leon|lion|lehoi|maul|mund|boca|mouth|aho)/.test(a)},
 {q:["In welchem Jahr wurde Ferdinand Franz Wallraf geboren? (Wallrafplatz)","¿En qué año nació Ferdinand Franz Wallraf? (Wallrafplatz)","In which year was Ferdinand Franz Wallraf born? (Wallrafplatz)","Zein urtetan jaio zen Ferdinand Franz Wallraf? (Wallrafplatz)"],ok:a=>a==="1748"},
 {q:["Welche Hausnummer gab einem weltberühmten Duft den Namen? (Glockengasse)","¿Qué número de casa dio nombre a un perfume famoso? (Glockengasse)","Which house number gave its name to a world-famous fragrance? (Glockengasse)","Zein etxe-zenbakik eman zion izena lurrin ospetsu bati? (Glockengasse)"],ok:a=>a==="4711"},
 {q:["Am Rathaus kämpft ein Bürgermeister mit einem Löwen. Wie heißt er mit Nachnamen?","En el ayuntamiento, un alcalde lucha contra un león. ¿Cuál es su apellido?","At the town hall, a mayor fights a lion. What is his surname?","Udaletxean alkate bat lehoi baten aurka borrokatzen da. Zein da bere abizena?"],ok:a=>/^(hermann)?(grin|gryn)$/.test(a)},
 {q:["Was streckt der Platzjabbeck zur vollen Stunde heraus?","¿Qué saca el Platzjabbeck a cada hora en punto?","What does the Platzjabbeck stick out on the hour?","Zer ateratzen du Platzjabbeckek ordu jotzean?"],ok:a=>/(zunge|lengua|tongue|mihi)/.test(a)},
 {q:["Nenne drei Geschäfte auf der Hohe Straße, die mit demselben Buchstaben anfangen.","Nombra tres tiendas de la Hohe Straße que empiecen por la misma letra.","Name three shops on Hohe Straße that start with the same letter.","Esan Hohe Straße kaleko hiru denda, letra beraz hasten direnak."],frei:true}
];

const KEY="koeln-entdecken-v1";
let st={merk:{},notiz:{},antw:{}};
try{const r=localStorage.getItem(KEY);if(r)st=Object.assign(st,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
let lang=L.includes(location.hash.slice(1))?location.hash.slice(1):"de";
try{if(!location.hash){const s=localStorage.getItem(KEY+"-lang");if(L.includes(s))lang=s;}}catch(e){}
let filter="alle";
const ix=()=>L.indexOf(lang), t=k=>T[k][ix()], x=a=>a[ix()];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function karte(o){
  const m=!!st.merk[o.id], n=st.notiz[o.id]||"";
  return `<article class="karte"><h3>${esc(x(o.o))}</h3><p class="wo">📍 ${esc(x(o.w))}</p><p class="txt">${esc(x(o.t))}</p>
  <p class="tipp"><b>${esc(t("tipp"))}:</b> ${esc(x(o.d))}</p>
  <div class="aktionen"><button class="merk ${m?"an":""}" data-m="${o.id}" aria-pressed="${m}">${esc(m?t("gemerkt"):t("merken"))}</button>
  <details ${n?"open":""}><summary>✎ ${esc(t("notiz"))}</summary><textarea data-n="${o.id}" placeholder="${esc(t("notizPh"))}">${esc(n)}</textarea><div class="gespeichert" id="g-${o.id}"></div></details></div></article>`;
}
function raetsel(){
  return R.map((r,i)=>{
    const a=st.antw[i]||""; let m="";
    if(a&&r.frei)m=`<p class="meld">${esc(t("offen"))}</p>`;
    else if(a)m=r.ok(N(a))?`<p class="meld ja">${esc(t("richtig"))}</p>`:`<p class="meld nein">${esc(t("falsch"))}</p>`;
    return `<div class="karte raetsel"><p><b>${i+1}.</b> ${esc(x(r.q))}</p><div class="antwort"><input type="text" id="r${i}" value="${esc(a)}" autocomplete="off" aria-label="${i+1}"><button data-r="${i}">${esc(t("pruefen"))}</button></div>${m}</div>`;
  }).join("");
}
function notizenText(){
  const zeilen=[t("titel")+" – "+t("notizen"),""];
  const gem=O.filter(o=>st.merk[o.id]);
  if(gem.length){zeilen.push(t("gemerkteOrte")+": "+gem.map(o=>x(o.o)).join(", "),"");}
  O.filter(o=>(st.notiz[o.id]||"").trim()).forEach(o=>{zeilen.push(x(o.o)+" ("+x(o.w)+")",st.notiz[o.id].trim(),"");});
  return zeilen.join("\n");
}
function seite(){
  let h="";
  if(filter==="notizen"){
    const mit=O.filter(o=>(st.notiz[o.id]||"").trim());
    const gem=O.filter(o=>st.merk[o.id]);
    h+=`<h2 class="frage">${esc(t("notizen"))}</h2>`;
    if(gem.length)h+=`<div class="karte"><p class="notiz-ort">★ ${esc(t("gemerkteOrte"))}</p><p class="notiz-txt">${gem.map(o=>esc(x(o.o))).join(" · ")}</p></div>`;
    if(!mit.length&&!gem.length)h+=`<p class="leer">${esc(t("leer"))}</p>`;
    h+=mit.map(o=>`<div class="karte"><p class="notiz-ort">${esc(x(o.o))}</p><p class="notiz-txt">${esc(st.notiz[o.id])}</p></div>`).join("");
    if(mit.length||gem.length)h+=`<button class="knopf" id="kopieren">${esc(t("kopieren"))}</button><p class="meld" id="kopMeld" aria-live="polite"></p>`;
  } else {
    if(filter==="alle")h+=`<section class="erasmus"><h2>${esc(t("erasmusT"))}</h2><p>${esc(t("erasmus"))}</p></section>`;
    K.filter(k=>filter==="alle"||filter===k.id).forEach(k=>{
      h+=`<h2 class="frage" id="k-${k.id}">${esc(x(k.q))}</h2><p>${esc(x(k.s))}</p>`;
      h+=k.id==="raetsel"?raetsel():O.filter(o=>o.k===k.id).map(karte).join("");
    });
  }
  document.getElementById("inhalt").innerHTML=h;
}
function alles(){
  document.documentElement.lang=lang;document.title=t("titel");
  document.getElementById("titel").textContent=t("titel");
  document.getElementById("sub").textContent=t("sub");
  document.getElementById("sprachen").innerHTML=L.map(l=>`<button data-l="${l}" class="${l===lang?"an":""}" aria-pressed="${l===lang}">${KURZ[l]}</button>`).join("");
  const chips=[["alle",t("alle")],...K.map(k=>[k.id,x(k.n)]),["notizen","✎ "+t("notizen")]];
  document.getElementById("chips").innerHTML=chips.map(c=>`<button data-f="${c[0]}" class="${c[0]===filter?"an":""}">${esc(c[1])}</button>`).join("");
  seite();
}
function pruefe(i){const el=document.getElementById("r"+i);if(!el)return;st.antw[i]=el.value.trim();save();seite();}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){lang=b.dataset.l;try{localStorage.setItem(KEY+"-lang",lang);}catch(e){}history.replaceState(null,"","#"+lang);alles();return;}
  if(b.dataset.f){filter=b.dataset.f;alles();window.scrollTo({top:document.getElementById("chips").offsetTop});return;}
  if(b.dataset.m){st.merk[b.dataset.m]=!st.merk[b.dataset.m];save();const m=st.merk[b.dataset.m];b.classList.toggle("an",m);b.setAttribute("aria-pressed",m);b.textContent=m?t("gemerkt"):t("merken");return;}
  if(b.dataset.r!==undefined){pruefe(+b.dataset.r);return;}
  if(b.id==="kopieren"){const m=document.getElementById("kopMeld");
    try{navigator.clipboard.writeText(notizenText()).then(()=>{m.className="meld ja";m.textContent=t("kopiert");},()=>{m.className="meld nein";m.textContent=t("nichtKopiert");});}
    catch(err){m.className="meld nein";m.textContent=t("nichtKopiert");}}
});
let timer;
document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.n;if(!id)return;st.notiz[id]=e.target.value;save();clearTimeout(timer);const g=document.getElementById("g-"+id);if(g){g.textContent=t("gespeichert");timer=setTimeout(()=>{g.textContent="";},1500);}});
document.addEventListener("keydown",e=>{if(e.target.id&&/^r\d+$/.test(e.target.id)&&e.key==="Enter")pruefe(+e.target.id.slice(1));});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(L.includes(h)&&h!==lang){lang=h;alles();}});
alles();
}
</script>

</html>
