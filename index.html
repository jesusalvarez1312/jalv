<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Regale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EAF3FF;
  --sky-2:#DCE9FF;
  --ink:#12304F;
  --ink-soft:#4E7099;
  --muted:#6C8BB0;
  --card:#FFFFFF;
  --card-2:#F6FAFF;
  --line:rgba(35,95,170,.16);
  --line-strong:rgba(35,95,170,.34);
  --blue:#2E7BF6;
  --violet:#6D5CF5;
  --cyan:#17B6D9;
  --plank-top:#A9CDF7;
  --plank-mid:#6D9FE0;
  --plank-low:#41709F;
  --grad:linear-gradient(135deg,var(--violet) 0%,var(--blue) 48%,var(--cyan) 100%);
  --shadow:0 12px 30px -16px rgba(23,70,130,.45);
  --r-lg:22px; --r-md:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(880px 520px at 10% -8%, #CFE4FF 0%, transparent 62%),
    radial-gradient(760px 460px at 94% 2%, #DED9FF 0%, transparent 58%),
    linear-gradient(180deg,var(--sky) 0%, var(--sky-2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Outfit',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

/* ---------- Kopfleiste + Pfad ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-family:'Outfit';font-weight:700;font-size:1.02rem}
.brand-mark{
  width:32px;height:32px;border-radius:11px;background:var(--grad);
  display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;flex:none;
}
.back{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:.85rem;font-weight:500;color:var(--ink-soft);
  transition:background .18s, transform .18s, color .18s;
}
.back:hover{background:var(--card-2);color:var(--ink);transform:translateX(-2px)}
.back[hidden]{display:none}

.crumbs{border-bottom:1px solid var(--line);background:rgba(255,255,255,.45)}
.crumbs-in{
  max-width:1120px;margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:.82rem;color:var(--muted);
}
.crumbs-in a{transition:color .16s}
.crumbs-in a:hover{color:var(--blue)}
.crumbs-in .sep{opacity:.45}
.crumbs-in .now{color:var(--ink);font-weight:600}
.topbar[hidden],.crumbs[hidden]{display:none}

/* ---------- Rahmen ---------- */
main{max-width:1120px;margin:0 auto;padding:34px 20px 90px}
.page-head{margin-bottom:30px}
.eyebrow{
  font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--blue);font-weight:600;margin-bottom:10px;
}
.page-head h1{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:700}
.page-head p{color:var(--ink-soft);margin:11px 0 0;max-width:56ch;line-height:1.6;font-size:.95rem}
.view{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Regal ---------- */
.shelf{margin-bottom:52px}
.shelf-head{display:flex;align-items:center;gap:15px;margin-bottom:18px;width:100%;text-align:left}
.ring{
  width:56px;height:56px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;flex:none;
  transition:transform .22s cubic-bezier(.2,.7,.3,1);
}
.ring-in{
  width:48px;height:48px;border-radius:50%;background:#fff;
  display:grid;place-items:center;color:var(--blue);
}
.shelf-head:hover .ring{transform:scale(1.06) rotate(-3deg)}
.shelf-title{font-size:1.28rem;font-weight:700}
.shelf-sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.shelf-go{margin-left:auto;color:var(--muted);font-size:1.3rem;transition:transform .2s,color .2s}
.shelf-head:hover .shelf-go{transform:translateX(4px);color:var(--blue)}

.board{position:relative;padding-bottom:20px}
.items{
  display:flex;gap:16px;overflow-x:auto;padding:4px 4px 20px;
  scrollbar-width:thin;scrollbar-color:var(--plank-mid) transparent;
}
.items::-webkit-scrollbar{height:6px}
.items::-webkit-scrollbar-thumb{background:var(--plank-mid);border-radius:99px}
.plank{
  height:13px;border-radius:5px;
  background:linear-gradient(180deg,var(--plank-top) 0%, var(--plank-mid) 55%, var(--plank-low) 100%);
  box-shadow:0 16px 26px -16px rgba(23,70,130,.75), inset 0 1px 0 rgba(255,255,255,.6);
}

/* ---------- Karten ---------- */
.item{
  flex:none;width:196px;min-height:150px;border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:15px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s, border-color .22s;
}
.item:hover{transform:translateY(-7px);box-shadow:0 20px 34px -16px rgba(23,70,130,.55);border-color:var(--line-strong)}
.item-name{font-family:'Outfit';font-weight:600;font-size:1rem;line-height:1.25}
.item-note{color:var(--muted);font-size:.78rem;margin-top:6px;line-height:1.45}
.chip{
  align-self:flex-start;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;padding:4px 9px;border-radius:99px;
  background:rgba(23,182,217,.12);color:#0E7E97;border:1px solid rgba(23,182,217,.32);
}
.chip.soon{background:rgba(108,139,176,.12);color:var(--muted);border-color:rgba(108,139,176,.3)}
.chip.live{background:rgba(46,123,246,.1);color:#1D5FC9;border-color:rgba(46,123,246,.32)}

/* ---------- Raster ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.tile{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:22px;min-height:158px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s, border-color .22s;
}
.tile:hover{transform:translateY(-5px);box-shadow:0 22px 36px -18px rgba(23,70,130,.55);border-color:var(--line-strong)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad)}
.tile-kuerzel{
  width:46px;height:46px;border-radius:13px;background:var(--grad);
  display:grid;place-items:center;font-family:'Outfit';font-weight:700;
  font-size:.8rem;color:#fff;margin-bottom:16px;
}
.tile h3{font-size:1.12rem;font-weight:600}
.tile p{color:var(--ink-soft);font-size:.82rem;margin:7px 0 0;line-height:1.5}
.tile-foot{margin-top:16px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}

.city{min-height:120px}
.city h3{font-size:1.24rem}
.city.off{opacity:.66}

.tour{padding:0;min-height:250px}
.tour-art{height:132px;position:relative;overflow:hidden;background:linear-gradient(140deg,#DCEAFF,#C7DCFA)}
.tour-art svg{position:absolute;inset:0;width:100%;height:100%}
.tour-body{padding:18px 20px 20px}
.tour-body h3{font-size:1.08rem}
.tour-body p{color:var(--ink-soft);font-size:.82rem;margin:7px 0 0;line-height:1.5}

/* ---------- Akkordeon ---------- */
.acc{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.acc-row + .acc-row{border-top:1px solid var(--line)}
.acc-btn{width:100%;display:flex;align-items:center;gap:14px;padding:19px 22px;text-align:left;transition:background .18s}
.acc-btn:hover{background:var(--card-2)}
.acc-year{font-family:'Outfit';font-weight:600;font-size:1.06rem}
.acc-meta{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:.8rem}
.acc-caret{transition:transform .26s cubic-bezier(.2,.7,.3,1);font-size:.8rem}
.acc-row.open .acc-caret{transform:rotate(180deg)}
.acc-panel{max-height:0;overflow:hidden;transition:max-height .34s cubic-bezier(.2,.7,.3,1)}
.acc-row.open .acc-panel{max-height:760px}
.acc-inner{padding:2px 22px 24px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.dot.off{background:rgba(108,139,176,.45)}

/* ---------- Kursseite (ohne Kopfleiste) ---------- */
.course-hero{
  border-radius:var(--r-lg);padding:32px;margin-bottom:26px;
  background:linear-gradient(135deg,#FFFFFF 0%,#E8F0FF 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.panel{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:22px;box-shadow:var(--shadow);
}
.panel h3{font-size:1rem;font-weight:600;margin-bottom:9px}
.panel p{color:var(--ink-soft);font-size:.85rem;line-height:1.6;margin:0}

/* ---------- Leer ---------- */
.empty{
  border:1px dashed var(--line-strong);border-radius:var(--r-lg);
  padding:46px 26px;text-align:center;background:rgba(255,255,255,.6);
}
.empty h3{font-size:1.15rem;margin-bottom:9px}
.empty p{color:var(--ink-soft);font-size:.9rem;margin:0 auto;max-width:44ch;line-height:1.6}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);
  background:#fff;border:1px solid var(--line);color:var(--ink);
  padding:13px 20px;border-radius:14px;font-size:.87rem;
  box-shadow:0 20px 44px -18px rgba(23,70,130,.6);
  opacity:0;pointer-events:none;transition:opacity .24s, transform .24s;z-index:99;
  max-width:min(440px,88vw);line-height:1.5;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  main{padding:26px 16px 70px}
  .topbar-in,.crumbs-in{padding-left:16px;padding-right:16px}
  .item{width:172px}
  .ring{width:48px;height:48px}.ring-in{width:41px;height:41px}
  .shelf{margin-bottom:42px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/">

<nav class="crumbs" id="crumbs-bar" aria-label="Pfad">

<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>

  {key:"wehrhahn",      titel:"Wehrhahn-Linie",       text:"Die Kunst in den Bahnhöfen der U-Bahn-Linie.", art:"line"},
  {key:"stadtrundfahrt",titel:"Stadtrundfahrt",       text:"Die große Runde durch Düsseldorf.",           art:"route"}

/* ============================================================
   3) Bausteine
   ============================================================ */

const shelf = o => '<section class="shelf"><button class="shelf-head" data-go="'+o.ziel+'">'+
  '<span class="ring"><span class="ring-in">'+o.icon+'</span></span>'+
  '<span><span class="shelf-title display">'+o.titel+'</span><span class="shelf-sub" style="display:block">'+o.sub+'</span></span>'+
  '<span class="shelf-go">&rsaquo;</span></button>'+
  '<div class="board"><div class="items">'+o.karten+'</div><div class="plank"></div></div></section>';

function karte(o){
  const attrs = o.href ? 'href="'+o.href+'" target="_blank" rel="noopener"' : 'data-go="'+o.go+'"';
  const tag = o.href ? "a" : "button";
  return '<'+tag+' class="item" '+attrs+'><span class="chip '+(o.chipClass||"")+'">'+o.chip+'</span>'+

   4) Seiten

/* ============================================================
   5) Navigation
   ============================================================ */
const app=document.getElementById("app");
const crumbs=document.getElementById("crumbs");
const crumbsBar=document.getElementById("crumbs-bar");
const topbar=document.getElementById("topbar");
const backBtn=document.getElementById("back");
const toastEl=document.getElementById("toast");
let toastTimer;

function toast(text){
  toastEl.textContent=text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),5500);
}

function render(){
  const pfad=decodeURIComponent(location.hash.slice(1))||"/";
  const seite=(SEITEN[pfad]||SEITEN["/"])();
  const zeigeLeiste = seite.chrome!==false;

  app.innerHTML='<div class="view">'+seite.html+'</div>';
  topbar.hidden=!zeigeLeiste;
  crumbsBar.hidden=!zeigeLeiste;
  document.documentElement.lang = seite.lang || "de";

  if(zeigeLeiste){
    crumbs.innerHTML=seite.crumbs.map((c,i)=>
      (i?'<span class="sep">/</span>':'')+
      (c[1]?'<a href="#'+c[1]+'">'+c[0]+'</a>':'<span class="now">'+c[0]+'</span>')
    ).join("");
    backBtn.hidden = pfad==="/";
    const zurueck=[...seite.crumbs].reverse().find(c=>c[1]);
    backBtn.onclick=()=>{ location.hash = zurueck ? "#"+zurueck[1] : "#/"; };
  }
  window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go){ location.hash="#"+go.dataset.go; return; }
  const hint=e.target.closest("[data-hinweis]");
  if(hint){ toast(hint.dataset.hinweis); return; }
  const acc=e.target.closest("[data-acc]");
  if(acc){
    const row=acc.closest(".acc-row");
    acc.setAttribute("aria-expanded", row.classList.toggle("open"));
  }
});

window.addEventListener("hashchange",render);
render();
</script>
